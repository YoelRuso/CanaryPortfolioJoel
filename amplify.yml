# AWS Amplify Hosting build settings.
# The site is static (no build step): this only copies the files the website needs
# into dist/, so project notes, tools and agent settings are not published.
version: 1
frontend:
  phases:
    build:
      commands:
        - mkdir -p dist
        - cp -r index.html css js assets dist/
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
